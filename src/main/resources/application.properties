# HikariCP Connection Pool Settings (prevent lock timeout issues)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Transaction timeout (5 seconds)
spring.transaction.default-timeout=5
# Lock timeout settings (Jakarta EE 9+ namespace)
spring.jpa.properties.jakarta.persistence.lock.timeout=5000
spring.jpa.properties.hibernate.query.timeout=5000

# Redis Configuration for Recommendation System
